name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_BASE_URL: https://api.example.com
  INTERNAL_API_BASE_URL: https://api.example.com

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Derive affected base
        uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check --base="$NX_BASE" --head="$NX_HEAD"
      - run: pnpm nx sync:check
      - run: pnpm nx affected -t lint typecheck test --parallel=3
      - run: pnpm nx affected -t build --parallel=2

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm nx affected -t e2e --parallel=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*-e2e/playwright-report
          retention-days: 7
