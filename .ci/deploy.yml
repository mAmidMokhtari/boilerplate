.deploy_helm:
  stage: deploy
  image: alpine/helm:3.16.2
  script:
    - apk add --no-cache curl
    - mkdir -p .helm $HOME/.kube
    - echo "${KUBE_CONFIG}" | base64 -d > $HOME/.kube/config
    - curl -fsS -o .helm/values.yml --header "PRIVATE-TOKEN:${CONFIG_REPO_TOKEN}" "${CI_API_V4_URL}/projects/${CONFIG_PROJECT_ID}/repository/files/${VALUES_FILE}/raw?ref=main"
    - helm repo add app ${HELM_REPO_URL} --username any --password ${CONFIG_REPO_TOKEN}
    - helm upgrade --install ${RELEASE} app/${CHART_NAME} -n ${NAMESPACE} --create-namespace -f .helm/values.yml --set image.tag=${IMAGE_TAG}

deploy_staging_web:
  extends: .deploy_helm
  variables: { RELEASE: staging-web, NAMESPACE: front-staging, VALUES_FILE: staging-web-values.yaml, IMAGE_TAG: $CI_COMMIT_SHA }
  needs: [build_staging_web]
  rules: [{ if: $CI_COMMIT_BRANCH == "develop" }]

deploy_staging_admin:
  extends: .deploy_helm
  variables: { RELEASE: staging-admin, NAMESPACE: front-staging, VALUES_FILE: staging-admin-values.yaml, IMAGE_TAG: $CI_COMMIT_SHA }
  needs: [build_staging_admin]
  rules: [{ if: $CI_COMMIT_BRANCH == "develop" }]

deploy_production_web:
  extends: .deploy_helm
  variables: { RELEASE: production-web, NAMESPACE: front-production, VALUES_FILE: production-web-values.yaml, IMAGE_TAG: $CI_COMMIT_TAG }
  needs: [build_production_web]
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]

deploy_production_admin:
  extends: .deploy_helm
  variables: { RELEASE: production-admin, NAMESPACE: front-production, VALUES_FILE: production-admin-values.yaml, IMAGE_TAG: $CI_COMMIT_TAG }
  needs: [build_production_admin]
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]
